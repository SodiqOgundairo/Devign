    <!-- FAQ Structured Data (GEO - helps AI engines surface answers) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Devign?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Devign is a modern React component library with 30+ components featuring glassmorphism effects, premium micro-animations, and a fully themeable design system built on Tailwind CSS v4. It includes buttons, cards, dialogs, inputs, toasts, and more — all accessible, TypeScript-first, and dark mode ready."
            }
          },
          {
            "@type": "Question",
            "name": "How do I install Devign?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Install with npm: npm install devign. Then import Tailwind CSS v4, add the @source directive for devign/dist, and import devign/styles.css in your CSS. Run npx devign init to generate a customizable theme file."
            }
          },
          {
            "@type": "Question",
            "name": "How do I customize the Devign theme?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Run npx devign init to generate a fully commented theme file (src/devign.css) with every design token. Change brand colors, accent colors, border radius, glassmorphism blur, shadows, typography, and transitions — every component updates automatically."
            }
          },
          {
            "@type": "Question",
            "name": "Does Devign support dark mode?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Devign supports dark mode via a .dark class on the HTML element. All glassmorphism effects, colors, and semantic tokens switch automatically — no extra setup needed."
            }
          },
          {
            "@type": "Question",
            "name": "What frameworks does Devign work with?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Devign works with Vite, Next.js (App Router and Pages Router), Remix, and Astro. It requires React 18+ and Tailwind CSS v4."
            }
          }
        ]
      }
